name: ci

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 2 * * *'
  push:
    branches: [ "main", "feat/github-actions" ]


env:
  APP_DIR: /app
  RELEASE_TAG_SLUG: ${{ github.run_id }}_${{ github.run_attempt }}
  WEB_SCRAPER_NAME: ncsc-caf-scraper
  LATEST_RELEASE_WORK_DIR: latest-release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Web Scraper Container Image Build
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: ${{ github.actor }}/${{ env.WEB_SCRAPER_NAME }}:latest
          build-args: 
            APP_DIR=${{ env.APP_DIR }}

      - name: Run Web Scraper Container
        run: | 
            docker run \
            --name ${{ env.WEB_SCRAPER_NAME }} \
            ${{ github.actor }}/${{ env.WEB_SCRAPER_NAME }}:latest
            
      - name: Extract Web Scraper Output Files
        run: |
          docker cp ${{ env.WEB_SCRAPER_NAME }}:${{ env.APP_DIR }}/output.json NCSC-CAF-${{ env.RELEASE_TAG_SLUG }}.json
          docker cp ${{ env.WEB_SCRAPER_NAME }}:${{ env.APP_DIR }}/output.md NCSC-CAF-${{ env.RELEASE_TAG_SLUG }}.md
          docker cp ${{ env.WEB_SCRAPER_NAME }}:${{ env.APP_DIR }}/output.log NCSC-CAF-${{ env.RELEASE_TAG_SLUG }}.log
          echo "OUTPUT_JSON=NCSC-CAF-${{ env.RELEASE_TAG_SLUG }}.json" >> $GITHUB_OUTPUT
          echo "OUTPUT_MD=NCSC-CAF-${{ env.RELEASE_TAG_SLUG }}.md" >> $GITHUB_OUTPUT
          echo "OUTPUT_LOG=NCSC-CAF-${{ env.RELEASE_TAG_SLUG }}.log" >> $GITHUB_OUTPUT
        id: extract_outputs
      
      - name: Check Web Scraper Output Log For Errors
        run: |
          if grep -q "ERROR" "${{ steps.extract_outputs.outputs.output_log }}"; then
            echo "Web scraper encountered an error. Check the log for details."
            exit 1
          fi

      - name: release-downloader
        uses: robinraju/release-downloader@v1.13
        with:
          latest: true
          fileName: '*'
          out-file-path: ${{env.LATEST_RELEASE_WORK_DIR}}
          
      - name: Compare Web Scraper Output to Latest Release
        id: check_changes
        run: |
          diff ${{ steps.extract_outputs.outputs.output_json }} ${{ env.LATEST_RELEASE_WORK_DIR }}/*.json && status=$? || status=$?
          if [ $status -eq 0 ]; then
            echo "This run webscraper output is identical to the latest release."
            echo "New release will not be published."
            echo "publish=false" >> $GITHUB_OUTPUT # <-- Set output to false
          else
            echo "This run webscraper output differs from latest release."
            echo "A new release will be published."
            echo "publish=true" >> $GITHUB_OUTPUT  # <-- Set output to true
          fi
  
      - name: Upload Web Scraper Output Json
        uses: actions/upload-artifact@v4
        if: steps.check_changes.outputs.publish == 'true'
        with:
          name: ${{ steps.extract_outputs.outputs.output_json }}
          path: ${{ steps.extract_outputs.outputs.output_json }}

      - name: Upload Web Scraper Output Markdown
        uses: actions/upload-artifact@v4
        if: steps.check_changes.outputs.publish == 'true'
        with:
          name: ${{ steps.extract_outputs.outputs.output_md }}
          path: ${{ steps.extract_outputs.outputs.output_md }}
        
      - name: Upload Web Scraper Output Log
        uses: actions/upload-artifact@v4
        if: steps.check_changes.outputs.publish == 'true'
        with:
          name: ${{ steps.extract_outputs.outputs.output_log }}
          path: ${{ steps.extract_outputs.outputs.output_log }}
      
      - name: Create Release With Artefacts
        uses: softprops/action-gh-release@v2
        if: steps.check_changes.outputs.publish == 'true'
        with:
          tag_name: ${{ env.RELEASE_TAG_SLUG }}
          files: |
            ${{ steps.extract_outputs.outputs.output_json }}
            ${{ steps.extract_outputs.outputs.output_md }}
            ${{ steps.extract_outputs.outputs.output_log }}
